[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termilyrics"
version = "0.2.0"
description = "Synced, animated lyrics in your terminal — karaoke sing-along mode, word-by-word timing, slowed/sped-up track support."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "syncedlyrics>=0.7",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "youtube-transcript-api>=0.6"
]

[project.optional-dependencies]
romanize = ["pykakasi>=2.2", "pypinyin>=0.50", "korean-romanizer>=0.9", "Unidecode>=1.3"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["lyrics_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
termilyrics = "lyrics_sync.main:main"
tlyrics = "lyrics_sync.main:main"
lyrics = "lyrics_sync.main:main"
